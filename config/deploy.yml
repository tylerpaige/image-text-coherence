service: image-text-coherence

# The name of the image in the container registry. If you are using GitHub's private registry, this will be <username>/<repo-name>
image: tylerpaige/image-text-coherence

servers:
  web:
    hosts:
      # Your server's IP address
      - 159.223.100.215 

proxy:
  ssl: true
  # Your custom domain
  host: image-text.typo.school
  app_port: 3000

# The container registry. I am using GitHub's private registry.
registry:
  server: ghcr.io
  username: tylerpaige
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # Paths are relative to the repo root (where `kamal` is run), not to each
  # other. Context stays `web` so the Dockerfile's COPY paths still match.
  context: web
  dockerfile: web/Dockerfile

env:
  clear:
    PORT: "3000"
  secret:
    - DATABASE_URL
    - APP_PASSWORD
    - SESSION_SECRET

accessories:
  db:
    image: pgvector/pgvector:pg16
    # Your server's IP address
    host: 159.223.100.215
    # Bound to localhost only -- reach it from your laptop via an SSH tunnel, never exposed to the public internet.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: postgres
        POSTGRES_DB: laion
      secret:
        - POSTGRES_PASSWORD
    files:
      - db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    directories:
      - data:/var/lib/postgresql/data
